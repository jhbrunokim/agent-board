name: Rust contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: agent_board_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/agent_board_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n scripts/install.sh
      - run: scripts/install.sh --prefix "$RUNNER_TEMP/agent-board-install" --binary target/debug/agent-board
      - run: bash tests/scripts/install-release.sh target/debug/agent-board
      - run: cargo test --locked -- --ignored --test-threads=1
